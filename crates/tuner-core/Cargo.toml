[package]
name = "tuner-core"
version = "0.1.0"
description = "Device-independent DSP 2.0 core: FFT spectrum, Fast YIN pitch detection, tracker, tuning math and synth"
edition = "2021"
rust-version = "1.100"
publish = false

[dependencies]
rustfft = "=6.4.1"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.154"
